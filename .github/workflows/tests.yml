name: Test
on: pull_request
permissions:
  checks: write
  pull-requests: write
jobs:
  run_tests:
    # macOS is required to build and run the Kotlin/Native iOS targets.
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Run checks
        run: ./gradlew clean check koverXmlReport

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action/macos@v2
        if: always()
        with:
          json_suite_details: true
          files: |
            **/inflekt-core/build/test-results/testAndroidHostTest/TEST*.xml
            **/inflekt-core/build/test-results/jvmTest/TEST*.xml
            **/inflekt-core/build/test-results/iosSimulatorArm64Test/TEST*.xml

      - name: Publish Kover Reports
        id: kover
        uses: mi-kas/kover-report@v2
        with:
          path: |
            ${{ github.workspace }}/inflekt-core/build/reports/kover/report.xml
          title: Code Coverage
          update-comment: true
